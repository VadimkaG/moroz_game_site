<h2>Игра началась!</h2>
<p><b>Помоги деду морозу создать праздник!</b><br> Твоя задача купить подарок и положить его в общую кучу подарков,<br> подписав его псевдонимом, который указан в письме.
<p><b>Что подарить?</b><br>Перейди по своей персональной ссылке.<br> Там ты увидишь письмо, которое поможет тебе определиться с выбором.</p>
